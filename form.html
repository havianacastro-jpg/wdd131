<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Product Review Form for WDD 131">
    <meta name="author" content="Hagot Coriantumr Viana Castro">
    <title>Product Review - WDD 131</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>
<body>
    <header>
        <h1>Product Review</h1>
    </header>
    <main>
        <form method="get" action="review.html" class="review-form">
            <fieldset>
                <legend>Product Information</legend>
                <div class="field">
                    <label for="productSelect">Product Name <span class="required">*</span></label>
                    <select id="productSelect" name="productName" required>
                        <option value="" disabled selected>Select a Product ...</option>
                    </select>
                </div>
                <div class="field">
                    <label>Overall Rating <span class="required">*</span></label>
                    <div class="rating-stars">
                        <label for="star1"><input type="radio" id="star1" name="rating" value="1" required> &#9734;</label>
                        <label for="star2"><input type="radio" id="star2" name="rating" value="2" required> &#9734;</label>
                        <label for="star3"><input type="radio" id="star3" name="rating" value="3" required> &#9734;</label>
                        <label for="star4"><input type="radio" id="star4" name="rating" value="4" required> &#9734;</label>
                        <label for="star5"><input type="radio" id="star5" name="rating" value="5" required> &#9734;</label>
                    </div>
                </div>
                <div class="field">
                    <label for="installDate">Date of Installation <span class="required">*</span></label>
                    <input type="date" id="installDate" name="installDate" required>
                </div>
            </fieldset>

            <fieldset>
                <legend>Product Feedback</legend>
                <div class="field">
                    <label>Which features did you find useful? (Check all that apply)</label>
                    <div class="checkbox-group">
                        <label for="feature1"><input type="checkbox" id="feature1" name="feature" value="durability"> Durability</label>
                        <label for="feature2"><input type="checkbox" id="feature2" name="feature" value="ease"> Ease of Use</label>
                        <label for="feature3"><input type="checkbox" id="feature3" name="feature" value="performance"> Performance</label>
                        <label for="feature4"><input type="checkbox" id="feature4" name="feature" value="design"> Design</label>
                    </div>
                </div>
                <div class="field">
                    <label for="writtenReview">Written Review (Optional)</label>
                    <textarea id="writtenReview" name="writtenReview" rows="4" placeholder="Write your review here..."></textarea>
                </div>
                <div class="field">
                    <label for="userName">Your Name (Optional)</label>
                    <input type="text" id="userName" name="userName" placeholder="Full Name">
                </div>
            </fieldset>

            <div class="form-submit">
                <input type="submit" value="Post Review">
            </div>
        </form>
    </main>
    <footer>
        <p>&copy; 2026 | Hagot Coriantumr Viana Castro - WDD 131</p>
    </footer>
</body>
</html>
